/* detectVerticalSquash & drawImageIOSFix = are functions that are critical due to a flaw in the iPhone camera software that squishes any photos displayed on an HTML5 canvas element. https://github.com/stomita/ios-imagefile-megapixel
*/
 function detectVerticalSquash(img) {
  var iw = img.naturalWidth, ih = img.naturalHeight; //natural height and with of the image
  var canvas = document.createElement('canvas'); //creating temporary canvas to inspect image
  canvas.width = 1; //pixel based on width
  canvas.height = ih; //pixel based on height
  var ctx = canvas.getContext('2d');
  
  ctx.drawImage(img, 0, 0); //drawing image into temporary canvas
  var data = ctx.getImageData(0, 0, 1, ih).data; //reading back the pixel data from temporary canvas
  //variables 
  var sy = 0;
  var ey = ih;
  var py = ih;
  //binary search
  while (py > sy) {
   var alpha = data[(py - 1) * 4 + 3];
   if (alpha === 0) {
    ey = py;
   } 
   else {
    sy = py;
   }
   py = (ey + sy) >> 1;
  }
  //ratio to control squish
  var ratio = (py / ih);
  return (ratio===0)?1:ratio;
 }

 function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) { // how much of the image is vertically squished
  var vertSquashRatio = detectVerticalSquash(img);
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio); //draw the image and correct vertical squish
 }

/* window.onload necessary to keep javascripts from running before the app gets a chance to load entirely. */
 window.onload = function() {
  var fileInput = document.getElementById('fileInput');
  var messageDisplayArea = document.getElementById('messageDisplayArea');
  /* fileInput.addEventListener looks for any change in the <input> tag indicating that the user has selected a file (picture). */
  fileInput.addEventListener('change', function(e) {
    var file = fileInput.files[0];
    var imageType = /image.*/;
    /* if (file.type.match(imageType)) checks that the selected file is indeed an image. */
    if (file.type.match(imageType)) {
      /* new FileReader(); and reader.onload start some kind of file reading process in javaScript. I do not understand why this is necessary although it may simply slow things down to let the image load. */
      var reader = new FileReader();
      reader.onload = function(e) {
        /* messageDisplayArea.innerHTML not needed but allows you to send a message at this point in the program. */
        messageDisplayArea.innerHTML = "You picked an image!";
        /* new Image() and img.onload start some kind of new image creation process in javaScript. I do not understand why this is necessary although it may simply slow things down to let the image load. */
        var img = new Image();
        img.onload = function() {
          /*This finally draws the image onto the first drawing canvas. The specific canvas is referred to by "context". This is established down in the HTML part of the file just under the first <canvas> tag. If we weren't worried about fixing an iPhone bug we would use context.drawImage(image, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500) instead of drawImageIOSFix */
        
          drawImageIOSFix(context,img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

          /*  +++++++++++++++ BEGIN IMAGE PROCESSING +++++++++++++++ */
          /*  ++++++++++++++++++++++++++++++++++++++++++++++++++++++ */

          /* PUT ANY CHANGES TO THE JAVASCRIPT HERE  */
          

         var blueCanvas = document.getElementById('blueCanvas');
         var blueContext = blueCanvas.getContext('2d');

         // makes the second canvas size the same as the first one
         blueCanvas.width = canvas.width; // controls the width of the canvas
         blueCanvas.height = canvas.height; //controls the height of the canvas

         var imageData = context.getImageData(0, 0, canvas.width, canvas.height);
         var data = imageData.data; // reading the pixel data from the first canvas 

         // setting the red and green to 0 through removal
         for (var i = 0; i < data.length; i += 4) {
          data [i] = 0; //red
          data [i + 1] = 0; //green
         }
         blueContext.putImageData(imageData, 0, 0); //includin the blue pixels on the second canvas
         
         console.log("Blue channel image successfully drawn on the second canvas."); //completion code

         /* ++++++++ END IMAGE PROCESSING ++++++++ */
                     
          
        } // end of img.onload
        
        img.src = reader.result; //loading the image data from the file
      } //  end of reader.onload
      
      reader.readAsDataURL(file); // reading the selected file as a data URL
    } // end of the if statement checking that file is an image
    else
    {
      // this is what happens if the orignial file selected is not an image file
      messageDisplayArea.innerHTML = "File not supported!"
    } // end of the else statement if file in NOT an image
  }); // end of the fileInput.addEventListener function
 } // end of the window.onload function

     <!-- First Canvas: original picture -->

        context.font = '20pt Calibri'; //original canvas image box font
        context.fillStyle = "black"; //original canvas image box word color
        context.fillText("Original image will go here", 10, 20); //words labelling the orginalcanvas image box
      </script>

      <!-- Second Canvas: blue channel image  -->

     <canvas id="blueCanvas" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas> <!--formatting for the blue canvas image box-->
  <script>
    // This script initializes the second canvas and puts text on "blueCanvas"

    blueContext.font = '20pt Calibri'; // font for the 
    blueContext.fillStyle = "blue"; //color of the blue canvas image box

  </script>
